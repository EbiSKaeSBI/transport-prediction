server {
    listen 80;
    # статика дашборда; SPA без роутов — всё живёт на /
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    # те же пути, что proxy в vite.config.ts для dev-режима
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location = /swagger { proxy_pass http://backend:8080; }
    location = /openapi.yaml { proxy_pass http://backend:8080; }
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
