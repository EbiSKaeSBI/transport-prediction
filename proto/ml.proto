// Каноническое описание контракта Go ↔ Python.
//
// Это схема для людей, а не описание проволоки. По ADR 0002 на проволосе
// HTTP+JSON: Go говорит через net/http, Python отдаёт JSON, который FastAPI
// генерирует в OpenAPI сам. Ни protoc, ни buf, ни кодогенерации в проекте
// нет — и намеренно: регенерация стала бы отдельной операцией пайплайна с
// собственными точками отказа, а строгости контракта добавляет ровно столько же,
// сколько даёт сверка списка имён признаков.
//
// Блок service здесь отсутствует намеренно: gRPC отклонён тем же ADR.
// PredictRequest и PredictResponse — это тела POST /predict и
// POST /predict/batch, и порядок элементов predictions не задан: клиент
// сопоставляет ответы по sample_id (ADR 0009).
//
// При расхождении схемы и JSON считается, что прав этот файл.
syntax = "proto3";

package predictor.v1;

message TelemetryPoint {
  int64 event_time_ms = 1;
  int64 receive_time_ms = 2;
  uint32 unit_id = 3;
  double latitude = 4;
  double longitude = 5;
  float speed_kmh = 6;
  float course_deg = 7;
  uint32 satellites = 8;
  float pdop = 9;
  bool location_valid = 10;
}

message TelemetryWindow {
  uint32 unit_id = 1;
  int64 window_start_ms = 2;
  int64 window_end_ms = 3;
  repeated TelemetryPoint points = 4;
}

message FeatureFrame {
  string sample_id = 1;
  uint32 unit_id = 2;
  int64 as_of_ms = 3;
  int32 horizon_s = 4;
  int32 target_stop_id = 5;
  map<string, double> values = 6;
  TelemetryWindow window = 7;
}

message PredictRequest {
  repeated FeatureFrame frames = 1;
}

message Prediction {
  string sample_id = 1;
  float predicted_delay_s = 2;
  float delta_s = 3;
  float p_late = 4;
  float p_ontime = 5;
  float p_early = 6;
  string reason = 7;
  float horizon_min = 8;
  string model_version = 9;
}

message PredictResponse {
  repeated Prediction predictions = 1;
  int64 inference_ms = 2;
  bool degraded = 3;
}

message ModelInfoResponse {
  string version = 1;
  string trained_at = 2;
  repeated string features = 3;
  float mae_validate_s = 4;
  float mae_test_s = 5;
  int32 feature_count = 6;
}

