# Ворота для #32: ровно то, что уже умеет Makefile, плюс go vet.
#
# Стек намеренно узкий. Модель и дашборд сюда не входят: ml требует uv и
# обученные артефакты, дашборд — npm и установку по lockfile. Ни то, ни другое
# не является воротами для контракта, который закрывает #32, а каждая лишняя
# зависимость в образе — это отдельная причина, по которой пайплайн падает
# не из-за кода. Когда у дашборда появится свой ворота (сборка и тесты), он
# добавится отдельной job, а не в эту.
#
# pytest ставится в venv, а не через apt: в golang-образе python3 есть, а
# pytest может лежать в системном пути или не лежать вовсе, и падать тогда
# будет непонятно почему. venv делает состав проверки явным.
image: golang:1.24

stages:
  - test

variables:
  # Не даём Go скачать другой toolchain молча: go.mod и образ должны
  # совпадать, и несовпадение лучше видно ошибкой сборки, чем скачиванием.
  GOTOOLCHAIN: "local"
  GIT_DEPTH: "20"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  GOCACHE: "$CI_PROJECT_DIR/backend/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/backend/.cache/go-mod"

backend:
  stage: test
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 python3-venv
    - python3 -m venv /opt/ci
    - /opt/ci/bin/pip install -q pytest
    # Makefile зовёт pytest по имени, а не через python3 -m, поэтому venv
    # должен быть в PATH.
    - export PATH="/opt/ci/bin:$PATH"
    # vet до тестов: он секунды и ловит ошибки типов, которые иначе
    # проявились бы через полминуты компиляции всех пакетов.
    - cd backend && go vet ./...
    # make test — это go test ./... и pytest tests -q. Сквозной тест на
    # золотом потоке NDTP входит сюда сам.
    - make test
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - backend/.cache/go-build
      - backend/.cache/go-mod
