[project]
name = "predictor"
version = "0.1.0"
description = "ML-модуль предсказания отклонения от графика движения транспорта"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "polars>=1.17",
    "catboost>=1.2.8",
    "numpy>=2.1",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "grpcio>=1.68",
    "protobuf>=5.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Naive стенное МСК без поясов — осознанное решение по данным (ADR 0004,
# features/v1.yaml, ловушка суффикса Z): «datetime без tzinfo» здесь не баг.
ignore = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
